<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>像素空间站 · three.js 体素版</title>
<link rel="icon" href="data:,">
<style>
 body{margin:0;background:#0a0b12;color:#cfd3e0;font:13px/1.6 Consolas,'Courier New',monospace;display:flex;flex-direction:column;align-items:center;padding:16px}
 h1{font-size:16px;margin:6px 0 2px;color:#ffd75e;letter-spacing:2px}
 .sub{color:#7a8194;margin-bottom:10px;font-size:12px}
 #stage{position:relative;width:720px;height:630px;border:2px solid #2a2f42;background:#000;cursor:crosshair;touch-action:none;overflow:hidden}
 #stage canvas{position:absolute;left:0;top:0;width:720px;height:630px;image-rendering:pixelated;pointer-events:none}
 .panel{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;justify-content:center;width:720px}
 button{background:#171a26;color:#cfd3e0;border:1px solid #343b55;padding:5px 10px;cursor:pointer;font:inherit}
 button.sel{border-color:#ffd75e;color:#ffd75e;background:#22200f}
 .sw{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
 .hint{color:#7a8194;font-size:12px;width:720px;text-align:center}
 .hint b{color:#9fd0ff;font-weight:normal}
 #stat{color:#5a6172;font-size:11px;margin-top:6px}
</style>
</head>
<body>
<h1>◈ 像素空间站 · three.js 真体素版 ◈</h1>
<div class="sub">正交投影 · 深度缓冲 · 阳光光晕 + 地球自转 | 渲染目标 240×210 → 最近邻放大3倍</div>
<div id="stage">
  <canvas id="bg" width="240" height="210"></canvas>
  <canvas id="view" width="240" height="210"></canvas>
  <canvas id="flare" width="240" height="210"></canvas>
</div>
<div class="panel" id="modPanel"></div>
<div class="hint">
 <b>拖拽</b> 旋转视角　<b>滚轮</b> 缩放　<b>左键</b> 在命中面外侧放置模块　<b>Shift+左键</b> 拆除　<b>O</b> 描边开关　<b>F</b> 光效开关　<b>空格</b> 暂停/恢复自转　<b>R</b> 重置空间站
</div>
<div id="stat"></div>

<script type="importmap">
{ "imports": { "three": "./three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const BW = 240, BH = 210, PX = 7, MAX = 2500;
const BODY_SCALE = 0.86;   // 本体占格 6/7，留出 1px 暗缝（像素风描边）
const HULL_SCALE = 1.02;   // 反向壳略大于格，避免共面闪烁

const TYPES = {
  1: { n: '桁架',        c: 0x969aa6 },
  2: { n: '居住舱',      c: 0xe8e8f2 },
  3: { n: '太阳能板',    c: 0x4664dc },
  4: { n: '散热板',      c: 0xdcd2b4 },
  5: { n: '天线',        c: 0xf0c83c },
  6: { n: '对接口/信标', c: 0xdc5a46 },
};
const K = (x, y, z) => x + ',' + y + ',' + z;
const statEl = document.getElementById('stat');

// ---------- 背景：星空（行星盘改由 3D 地球承担，铺在 WebGL 画布下面） ----------
const bg = document.getElementById('bg');
(function paintBackground() {
  const b = bg.getContext('2d');
  b.fillStyle = '#04050c'; b.fillRect(0, 0, BW, BH);
  // 淡淡的银河带，给纯黑底一点层次
  const neb = b.createRadialGradient(BW * 0.62, BH * 0.3, 10, BW * 0.62, BH * 0.3, 150);
  neb.addColorStop(0, 'rgba(58,70,130,0.20)');
  neb.addColorStop(0.5, 'rgba(38,46,92,0.10)');
  neb.addColorStop(1, 'rgba(10,12,30,0)');
  b.fillStyle = neb; b.fillRect(0, 0, BW, BH);
  for (let k = 0; k < 170; k++) {
    const x = (Math.random() * BW) | 0, y = (Math.random() * BH) | 0, m = Math.random();
    const col = m < 0.6 ? '#ffffff' : m < 0.78 ? '#9fb8ff' : m < 0.9 ? '#ffd9a0' : '#7fe3ff';
    b.fillStyle = col;
    if (m > 0.97) { b.fillRect(x - 1, y, 3, 1); b.fillRect(x, y - 1, 1, 3); } else b.fillRect(x, y, 1, 1);
  }
})();

// ---------- 渲染器 ----------
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('view'), antialias: false, alpha: true });
} catch (err) {
  statEl.textContent = 'WebGL 初始化失败：' + err.message;
  throw err;
}
renderer.setPixelRatio(1);
renderer.setSize(BW, BH, false);          // 内部只有 240×210，靠 CSS 放大 3 倍
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
renderer.autoClear = false;                // 双 pass：地球 → 空间站，手动清屏

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-BW / 2 / PX, BW / 2 / PX, BH / 2 / PX, -BH / 2 / PX, 0.1, 500);
const TARGET = new THREE.Vector3(0, 0.35, 0);
let yaw = 0.6, pitch = 0.35, zoom = 1, autoRot = true;

function updateCamera() {
  const cp = Math.cos(pitch), sp = Math.sin(pitch), d = 120;
  camera.position.set(
    TARGET.x + Math.sin(yaw) * cp * d,
    TARGET.y + sp * d,
    TARGET.z + Math.cos(yaw) * cp * d
  );
  camera.lookAt(TARGET);
  camera.zoom = zoom;
  camera.updateProjectionMatrix();
}

// ---------- 光照（太阳方向沿用 2D 版，世界空间固定） ----------
const sun = new THREE.DirectionalLight(0xfff3dd, 3.1);
sun.position.set(-0.4, 0.65, -0.65).normalize().multiplyScalar(80);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x8ea6ff, 0x151721, 1.5));
scene.add(new THREE.AmbientLight(0xffffff, 0.12));

// 地球反照光：从画面左下方补一点蓝色，背光面不至于死黑
const earthShine = new THREE.DirectionalLight(0x4a7bd6, 0.55);
earthShine.position.set(-0.5, -0.45, 0.75).normalize().multiplyScalar(60);
scene.add(earthShine);

// ---------- 体素：InstancedMesh ----------
const geo = new THREE.BoxGeometry(1, 1, 1);
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.82, metalness: 0.08 });
const mesh = new THREE.InstancedMesh(geo, bodyMat, MAX);
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
mesh.frustumCulled = false;
mesh.count = 0;
scene.add(mesh);

// 反向壳描边：BackSide 放大壳，只在轮廓处露出来
const hullMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.BackSide });
const hull = new THREE.InstancedMesh(geo, hullMat, MAX);
hull.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
hull.frustumCulled = false;
hull.count = 0;
scene.add(hull);

let outlineOn = true;

// ================= 太空氛围：太阳光晕 / 镜头光晕 / 地球自转 =================

// 径向渐变贴图，供太阳与大气辉光复用
function makeGlowTexture(core, mid) {
  const s = 64, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grd.addColorStop(0, core);
  grd.addColorStop(0.32, mid);
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const glowTex = makeGlowTexture('rgba(255,255,255,1)', 'rgba(255,236,190,0.55)');

// ---- 太阳方向（世界空间固定） ----
// 正交视锥只有 ±17 个单位，真实距离的太阳几乎永远在画面外，
// 所以太阳按"天球投影"画在 2D 叠层上：方向固定，随视角在画面里扫过。
const sunDir = new THREE.Vector3(-0.4, 0.65, -0.65).normalize();

// ---- 地球：独立固定相机 pass，构图稳定，球体自身缓慢自转 ----
const earthScene = new THREE.Scene();
const earthCam = new THREE.OrthographicCamera(-BW / 2, BW / 2, BH / 2, -BH / 2, 0.1, 500);
earthCam.position.set(0, 0, 200);
earthCam.lookAt(0, 0, 0);

function makeEarthTexture() {
  const w = 512, h = 256;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, '#08152c');
  grd.addColorStop(0.22, '#17458c');
  grd.addColorStop(0.5, '#2a74c8');
  grd.addColorStop(0.78, '#17458c');
  grd.addColorStop(1, '#08152c');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);

  let seed = 20261127;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  // 大陆：不规则多边形块（少而小，保证海面占主）
  for (let i = 0; i < 18; i++) {
    const cx = rnd() * w, cy = 26 + rnd() * (h - 52), r = 9 + rnd() * 30;
    g.fillStyle = 'hsl(' + (78 + rnd() * 40) + ',' + (18 + rnd() * 18) + '%,' + (20 + rnd() * 12) + '%)';
    g.beginPath();
    const n = 9 + (rnd() * 7 | 0);
    for (let k = 0; k < n; k++) {
      const a = k / n * Math.PI * 2, rr = r * (0.5 + rnd() * 0.8);
      const x = cx + Math.cos(a) * rr * 1.6, y = cy + Math.sin(a) * rr;
      k ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath(); g.fill();
  }
  // 极冠
  g.fillStyle = 'rgba(232,242,255,0.9)';
  g.fillRect(0, 0, w, 9);
  g.fillRect(0, h - 10, w, 10);
  // 云带
  g.globalAlpha = 0.16; g.fillStyle = '#ffffff';
  for (let i = 0; i < 90; i++) {
    g.beginPath();
    g.ellipse(rnd() * w, rnd() * h, 5 + rnd() * 24, 2 + rnd() * 6, 0, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;
  // 抖动噪声：打散 8bit 渐变的色阶断层
  const imgd = g.getImageData(0, 0, w, h), pp = imgd.data;
  for (let i = 0; i < pp.length; i += 4) {
    const n = (Math.random() * 7 - 3) | 0;
    pp[i] = Math.max(0, Math.min(255, pp[i] + n));
    pp[i + 1] = Math.max(0, Math.min(255, pp[i + 1] + n));
    pp[i + 2] = Math.max(0, Math.min(255, pp[i + 2] + n));
  }
  g.putImageData(imgd, 0, 0);
  return c;
}

const earthTex = new THREE.CanvasTexture(makeEarthTexture());
earthTex.colorSpace = THREE.SRGBColorSpace;
earthTex.wrapS = THREE.RepeatWrapping;

const EARTH = { x: -142, y: -134, r: 104 };
const earthPivot = new THREE.Group();
earthPivot.position.set(EARTH.x, EARTH.y, 0);
earthPivot.rotation.z = 0.24;                       // 轴倾角
earthScene.add(earthPivot);

const earth = new THREE.Mesh(
  new THREE.SphereGeometry(EARTH.r, 56, 36),
  new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.95, metalness: 0 })
);
earthPivot.add(earth);

// 大气边缘光：菲涅尔加法混合，让星球轮廓有一圈蓝色辉光
const rimMat = new THREE.ShaderMaterial({
  uniforms: { glowColor: { value: new THREE.Color(0x4d8cff) } },
  vertexShader: [
    'varying vec3 vN; varying vec3 vP;',
    'void main() {',
    '  vN = normalize(normalMatrix * normal);',
    '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
    '  vP = mv.xyz;',
    '  gl_Position = projectionMatrix * mv;',
    '}',
  ].join('\n'),
  fragmentShader: [
    'uniform vec3 glowColor; varying vec3 vN; varying vec3 vP;',
    'void main() {',
    '  float f = pow(1.0 - abs(dot(normalize(vN), normalize(-vP))), 2.6);',
    '  gl_FragColor = vec4(glowColor, f * 0.7);',
    '}',
  ].join('\n'),
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.FrontSide,
});
const earthRim = new THREE.Mesh(new THREE.SphereGeometry(EARTH.r * 1.05, 48, 32), rimMat);
earthPivot.add(earthRim);

// 大气辉光：垫在球体后面，只露出轮廓外的一圈
const earthHalo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTex, color: 0x5f8dff, blending: THREE.AdditiveBlending,
  transparent: true, opacity: 0.32, depthWrite: false,
}));
earthHalo.position.set(EARTH.x, EARTH.y, -140);
earthHalo.scale.setScalar(EARTH.r * 2.5);
earthScene.add(earthHalo);

// 地球这一 pass 的阳光从镜头前方来，才能照出漂亮的明暗界线
const earthSun = new THREE.DirectionalLight(0xfff6e6, 3.6);
earthSun.position.set(-0.55, 0.62, 0.56).normalize().multiplyScalar(160);
earthScene.add(earthSun);
earthScene.add(new THREE.AmbientLight(0x2a3f66, 0.5));

// ---- 镜头光晕（2D 叠层，按"天球投影"定位太阳） ----
const flareCanvas = document.getElementById('flare');
const fctx = flareCanvas.getContext('2d');
let flareOn = true;
const camRight = new THREE.Vector3();
const camUp = new THREE.Vector3();
const camFwd = new THREE.Vector3();
const flareRay = new THREE.Raycaster();
const flareNdc2 = new THREE.Vector2();
const SKY = 76;          // 太阳在天球上的投影半径：决定它扫过画面时离中心多远

function drawFlare() {
  fctx.clearRect(0, 0, BW, BH);
  if (!flareOn) return;

  const e = camera.matrixWorld.elements;
  camRight.set(e[0], e[1], e[2]);
  camUp.set(e[4], e[5], e[6]);
  camFwd.set(-e[8], -e[9], -e[10]);

  const front = sunDir.dot(camFwd);
  if (front <= 0.02) return;                       // 太阳转到了相机背后

  const sx = BW / 2 + sunDir.dot(camRight) * SKY;
  const sy = BH / 2 - sunDir.dot(camUp) * SKY;
  const margin = Math.min(sx, BW - sx, sy, BH - sy);
  if (margin < -46) return;                        // 完全出画
  const edge = Math.max(0, Math.min(1, (margin + 46) / 92));
  const fadeIn = Math.min(1, front * 1.8);         // 刚掠过画面边缘时淡入

  // 被空间站挡住：只留一点点辉光溢出，像 bloom
  flareNdc2.set((sx / BW) * 2 - 1, -((sy / BH) * 2 - 1));
  flareRay.setFromCamera(flareNdc2, camera);
  const occluded = flareRay.intersectObject(mesh, false).length > 0;
  const a = edge * fadeIn * (occluded ? 0.12 : 1);
  if (a <= 0.003) return;

  fctx.globalCompositeOperation = 'lighter';

  // 外晕
  const g = fctx.createRadialGradient(sx, sy, 0, sx, sy, 52);
  g.addColorStop(0, 'rgba(255,248,224,' + (0.52 * a) + ')');
  g.addColorStop(0.22, 'rgba(255,226,156,' + (0.26 * a) + ')');
  g.addColorStop(1, 'rgba(255,190,90,0)');
  fctx.fillStyle = g;
  fctx.fillRect(sx - 52, sy - 52, 104, 104);

  // 光芒：长短交替，缓慢旋转
  const t = performance.now() * 0.0004;
  for (let i = 0; i < 12; i++) {
    const ang = (i / 12) * Math.PI * 2 + t;
    const len = 14 + (i % 3) * 14 + Math.sin(t * 6 + i) * 4;
    const x2 = sx + Math.cos(ang) * len, y2 = sy + Math.sin(ang) * len;
    const lg = fctx.createLinearGradient(sx, sy, x2, y2);
    lg.addColorStop(0, 'rgba(255,242,206,' + (0.38 * a) + ')');
    lg.addColorStop(1, 'rgba(255,200,120,0)');
    fctx.strokeStyle = lg;
    fctx.lineWidth = (i % 4 === 0) ? 3 : 1;
    fctx.beginPath(); fctx.moveTo(sx, sy); fctx.lineTo(x2, y2); fctx.stroke();
  }

  // 硬核（像素对齐，保持像素风）
  fctx.fillStyle = 'rgba(255,255,250,' + (0.9 * a) + ')';
  fctx.fillRect(Math.round(sx) - 2, Math.round(sy) - 2, 4, 4);
  fctx.fillStyle = 'rgba(255,255,255,' + (0.6 * a) + ')';
  fctx.fillRect(Math.round(sx) - 1, Math.round(sy) - 3, 2, 6);
  fctx.fillRect(Math.round(sx) - 3, Math.round(sy) - 1, 6, 2);

  // 镜头鬼影：沿"太阳 → 画面中心"的连线
  const ccx = BW / 2, ccy = BH / 2;
  const ghosts = [[0.55, 7, 'rgba(120,200,255,'], [0.8, 4, 'rgba(255,150,220,'], [1.15, 10, 'rgba(140,255,210,'], [1.45, 5, 'rgba(255,220,150,']];
  for (const [k, r, col] of ghosts) {
    const gx = ccx + (ccx - sx) * k, gy = ccy + (ccy - sy) * k;
    const gg = fctx.createRadialGradient(gx, gy, 0, gx, gy, r);
    gg.addColorStop(0, col + (0.2 * a) + ')');
    gg.addColorStop(1, col + '0)');
    fctx.fillStyle = gg;
    fctx.beginPath(); fctx.arc(gx, gy, r, 0, Math.PI * 2); fctx.fill();
  }

  fctx.globalCompositeOperation = 'source-over';
}

const voxels = [];              // [{x,y,z,t}] —— 实例下标 = 数组下标
const indexOf = new Map();      // "x,y,z" -> 数组下标
const dummy = new THREE.Object3D();
const tmpCol = new THREE.Color();

function writeInstance(i) {
  const v = voxels[i];
  dummy.rotation.set(0, 0, 0);
  dummy.position.set(v.x, v.y, v.z);
  dummy.scale.setScalar(BODY_SCALE);
  dummy.updateMatrix();
  mesh.setMatrixAt(i, dummy.matrix);
  mesh.setColorAt(i, tmpCol.setHex(TYPES[v.t].c));
  mesh.instanceMatrix.needsUpdate = true;
  mesh.instanceColor.needsUpdate = true;

  dummy.scale.setScalar(HULL_SCALE);
  dummy.updateMatrix();
  hull.setMatrixAt(i, dummy.matrix);
  hull.setColorAt(i, tmpCol.setHex(TYPES[v.t].c).multiplyScalar(0.26));
  hull.instanceMatrix.needsUpdate = true;
  hull.instanceColor.needsUpdate = true;
}

function addV(x, y, z, t) {
  const k = K(x, y, z);
  if (indexOf.has(k)) return false;
  if (voxels.length >= MAX) return false;
  voxels.push({ x, y, z, t });
  indexOf.set(k, voxels.length - 1);
  mesh.count = hull.count = voxels.length;
  writeInstance(voxels.length - 1);
  return true;
}

function delIdx(i) {
  if (i < 0 || i >= voxels.length) return;
  const v = voxels[i];
  indexOf.delete(K(v.x, v.y, v.z));
  const last = voxels.length - 1;
  if (i !== last) {
    voxels[i] = voxels[last];
    indexOf.set(K(voxels[i].x, voxels[i].y, voxels[i].z), i);
    writeInstance(i);
  }
  voxels.pop();
  mesh.count = hull.count = voxels.length;
}

// ---------- 默认空间站（坐标与 2D 版完全一致） ----------
function buildDefault() {
  voxels.length = 0; indexOf.clear(); mesh.count = 0; hull.count = 0;
  for (let x = -9; x <= 9; x++) addV(x, 0, 0, 1);                                     // 主桁架
  for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) addV(x, y, z, 2); // 中央居住舱
  for (const sx of [-1, 1]) {
    for (let z = -5; z <= 5; z++) addV(sx * 6, 1, z, 3);                               // 主太阳翼
    for (let z = -3; z <= 3; z++) addV(sx * 8, -1, z, 3);                              // 副太阳翼
    addV(sx * 3, 1, 0, 1);                                                             // 散热板支杆
    for (let y = 1; y <= 3; y++) { addV(sx * 3, y, 1, 4); addV(sx * 3, y, -1, 4); }     // 散热板
  }
  for (let y = 2; y <= 4; y++) addV(0, y, 0, 5);                                       // 通讯主桅
  addV(-1, 4, 0, 5); addV(1, 4, 0, 5); addV(0, 4, 1, 5); addV(0, 4, -1, 5); addV(0, 5, 0, 5);
  addV(0, 6, 0, 6);                                                                    // 桅顶信标
  addV(0, 0, 2, 1); addV(0, 0, 3, 1); addV(0, 0, 4, 6);                                // 对接口 +Z
  addV(0, 0, -2, 1); addV(0, 0, -3, 1); addV(0, 0, -4, 6);                             // 对接口 -Z
  addV(4, 1, 0, 1); addV(4, 2, 0, 1); addV(4, 2, 1, 1); addV(4, 3, 1, 1); addV(4, 3, 2, 1); addV(4, 3, 3, 6);      // 机械臂 A
  addV(-4, 1, 0, 1); addV(-4, 2, 0, 1); addV(-4, 2, -1, 1); addV(-4, 3, -1, 1); addV(-4, 3, -2, 1); addV(-4, 4, -2, 5); // 机械臂 B
  addV(-7, 1, 0, 5); addV(-7, 2, 0, 5); addV(-7, 3, 0, 6);                            // 小型通讯桅
  addV(-6, -1, 0, 2); addV(-6, -2, 0, 2); addV(6, -1, 0, 2); addV(6, -2, 0, 2);       // 下挂居住舱
  addV(9, 1, 0, 6); addV(-9, 1, 0, 6);                                                 // 桁架端信标
}

// ---------- 悬停指示：命中高亮 + 幽灵预览 ----------
const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1));
const hi = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffd75e, depthTest: false, transparent: true, opacity: 0.95 }));
hi.scale.setScalar(1.03); hi.renderOrder = 11; hi.visible = false; scene.add(hi);
const ghost = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x9fd0ff, depthTest: false, transparent: true, opacity: 0.9 }));
ghost.scale.setScalar(1.02); ghost.renderOrder = 12; ghost.visible = false; scene.add(ghost);

// ---------- 射线拾取 ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let hover = null;

function castAt(clientX, clientY) {
  const r = stage.getBoundingClientRect();
  ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(mesh, false);
  return hits.length ? hits[0] : null;
}

function hideCursors() { hi.visible = false; ghost.visible = false; hover = null; }

function updateHover(e) {
  const h = castAt(e.clientX, e.clientY);
  if (!h) { hideCursors(); return; }
  const v = voxels[h.instanceId];
  const n = h.face.normal;                       // 与实例矩阵无关的轴向法线
  const cell = { x: v.x + Math.round(n.x), y: v.y + Math.round(n.y), z: v.z + Math.round(n.z) };
  hi.position.set(v.x, v.y, v.z); hi.visible = true;
  const free = !indexOf.has(K(cell.x, cell.y, cell.z)) && voxels.length < MAX;
  ghost.position.set(cell.x, cell.y, cell.z);
  ghost.visible = free;
  hover = { instanceId: h.instanceId, cell, free };
}

// ---------- 交互 ----------
let dragging = false, moved = 0, lx = 0, ly = 0, typeSel = 1;

stage.addEventListener('pointerdown', e => {
  dragging = true; moved = 0; lx = e.clientX; ly = e.clientY;
  try { stage.setPointerCapture(e.pointerId); } catch (_) { /* 合成事件可能没有有效 pointerId */ }
  hideCursors();
});

stage.addEventListener('pointermove', e => {
  if (!dragging) { updateHover(e); return; }
  const dx = e.clientX - lx, dy = e.clientY - ly;
  moved += Math.abs(dx) + Math.abs(dy);
  yaw -= dx * 0.008;   // 取反：鼠标向右拖 → 相机向左绕行 → 模型跟着向右转
  pitch = Math.max(-1.2, Math.min(1.2, pitch + dy * 0.008));
  lx = e.clientX; ly = e.clientY;
});

stage.addEventListener('pointerup', e => {
  const wasDrag = moved >= 6;
  dragging = false;
  if (wasDrag) { updateHover(e); return; }
  // pointerdown 会清掉 hover，这里按松手位置重新拾取，避免点击无效
  const h = castAt(e.clientX, e.clientY);
  if (!h) { hideCursors(); return; }
  const v = voxels[h.instanceId];
  const n = h.face.normal;
  const cell = { x: v.x + Math.round(n.x), y: v.y + Math.round(n.y), z: v.z + Math.round(n.z) };
  if (e.shiftKey) {
    delIdx(h.instanceId);
  } else if (!indexOf.has(K(cell.x, cell.y, cell.z))) {
    if (voxels.length >= MAX) { statEl.textContent = '已达上限 ' + MAX + ' 块'; return; }
    addV(cell.x, cell.y, cell.z, typeSel);
  }
  updateHover(e);
});

stage.addEventListener('pointerleave', hideCursors);

stage.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.min(2.2, Math.max(0.5, zoom * (e.deltaY > 0 ? 0.9 : 1.1)));
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '6') setType(+e.key);
  else if (e.key === ' ') { autoRot = !autoRot; syncBtns(); e.preventDefault(); }
  else if (e.key === 'o' || e.key === 'O') { outlineOn = !outlineOn; hull.visible = outlineOn; syncBtns(); }
  else if (e.key === 'f' || e.key === 'F') { flareOn = !flareOn; syncBtns(); }
  else if (e.key === 'r' || e.key === 'R') { buildDefault(); }
});

// ---------- 模块选择 UI ----------
const panel = document.getElementById('modPanel');
function setType(t) { typeSel = t; syncBtns(); }
function syncBtns() {
  document.querySelectorAll('#modPanel button[data-t]').forEach(b => b.classList.toggle('sel', +b.dataset.t === typeSel));
  bP.textContent = '自转:' + (autoRot ? '开' : '停') + '(空格)';
  bO.textContent = '描边:' + (outlineOn ? '开' : '关') + '(O)';
  bF.textContent = '光效:' + (flareOn ? '开' : '关') + '(F)';
}
for (let t = 1; t <= 6; t++) {
  const b = document.createElement('button'); b.dataset.t = t;
  b.innerHTML = '<span class="sw" style="background:#' + TYPES[t].c.toString(16).padStart(6, '0') + '"></span>' + t + '·' + TYPES[t].n;
  b.onclick = () => setType(t); panel.appendChild(b);
}
const bR = document.createElement('button'); bR.textContent = '重置(R)'; bR.onclick = buildDefault; panel.appendChild(bR);
const bP = document.createElement('button'); bP.onclick = () => { autoRot = !autoRot; syncBtns(); }; panel.appendChild(bP);
const bO = document.createElement('button'); bO.onclick = () => { outlineOn = !outlineOn; hull.visible = outlineOn; syncBtns(); }; panel.appendChild(bO);
const bF = document.createElement('button'); bF.onclick = () => { flareOn = !flareOn; syncBtns(); }; panel.appendChild(bF);

// ---------- 主循环 ----------
buildDefault();
updateCamera();
setType(1);
let fc = 0;
function tick() {
  if (autoRot) yaw += 0.006;
  updateCamera();
  earth.rotation.y += 0.0022;                     // 地球自转（约 48 秒一圈）

  renderer.clear(true, true, true);
  renderer.render(earthScene, earthCam);          // pass 1：地球（固定构图）
  renderer.clearDepth();
  renderer.render(scene, camera);                 // pass 2：空间站（可旋转）
  drawFlare();                                    // 2D 叠层：阳光光芒与鬼影

  if ((fc++ % 15) === 0) {
    statEl.textContent = '模块数: ' + voxels.length + ' | 体素像素: ' + (PX * zoom).toFixed(1) + 'px | 渲染分辨率: ' + BW + '×' + BH + ' | three r' + THREE.REVISION;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
